version: '3.9'

services:
  marketpulse.api:
    build:
      context: .
      dockerfile: MarketPulse.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=marketpulse;Username=postgres;Password=postgres
    depends_on:
      - db

  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: marketpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
