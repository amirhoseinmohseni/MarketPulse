services:
  marketpulse.api:
    build:
      context: .
      dockerfile: MarketPulse.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB must be set};Username=${POSTGRES_USER:?POSTGRES_USER must be set};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      OpenRouter__ApiKey: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set}
      OpenRouter__Model: ${OPENROUTER_MODEL:-openrouter/auto}
      OpenRouter__Endpoint: ${OPENROUTER_ENDPOINT:-https://openrouter.ai/api/v1/chat/completions}
      OpenRouter__Temperature: ${OPENROUTER_TEMPERATURE:-0.2}
      OpenRouter__MaxTokens: ${OPENROUTER_MAX_TOKENS:-800}
      OpenRouter__TimeoutSeconds: ${OPENROUTER_TIMEOUT_SECONDS:-60}
      OpenRouter__MaxRetryAttempts: ${OPENROUTER_MAX_RETRY_ATTEMPTS:-2}
      OpenRouter__RetryBaseDelayMilliseconds: ${OPENROUTER_RETRY_BASE_DELAY_MILLISECONDS:-500}
      DataCollectors__FailFast: ${DATA_COLLECTORS_FAIL_FAST:-false}
      DataCollectors__Sources__Reddit__Enabled: ${DATA_COLLECTORS_REDDIT_ENABLED:-false}
      DataCollectors__Sources__HackerNews__Enabled: ${DATA_COLLECTORS_HACKERNEWS_ENABLED:-true}
      HackerNews__BaseUrl: ${HACKERNEWS_BASE_URL:-https://hn.algolia.com/api/v1}
      HackerNews__DefaultLimit: ${HACKERNEWS_DEFAULT_LIMIT:-20}
      HackerNews__Tags: ${HACKERNEWS_TAGS:-story}
      Reddit__ClientId: ${REDDIT_CLIENT_ID:-}
      Reddit__ClientSecret: ${REDDIT_CLIENT_SECRET:-}
      Reddit__UserAgent: ${REDDIT_USER_AGENT:-MarketPulse/1.0}
      Reddit__AuthUrl: ${REDDIT_AUTH_URL:-https://www.reddit.com/api/v1/access_token}
      Reddit__BaseUrl: ${REDDIT_BASE_URL:-https://oauth.reddit.com}
      Reddit__DefaultLimit: ${REDDIT_DEFAULT_LIMIT:-25}
    depends_on:
      db:
        condition: service_healthy
      marketpulse.migrator:
        condition: service_completed_successfully

  marketpulse.migrator:
    build:
      context: .
      dockerfile: MarketPulse.Api/Dockerfile
      target: migrator
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB must be set};Username=${POSTGRES_USER:?POSTGRES_USER must be set};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
